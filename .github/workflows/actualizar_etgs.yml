name: Procesar PDFs de ETGS

on:
  schedule:
    # Se ejecuta todos los días a las 09:15 AM (UTC-3)
    - cron: '15 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pdfplumber pandas

    - name: Ejecutar Parser de PDFs
      run: |
        python scripts/parse_etgs.py

    - name: Commitear y Pushear resultados actualizados
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/etgs.json
        git status
        git diff --staged --quiet || (git commit -m "Auto-update etgs.json desde PDFs en raw" && git push)
