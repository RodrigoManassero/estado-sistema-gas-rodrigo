name: Parse CCO Minutas

on:
  push:
    paths:
      - 'raw/Minuta*.docx'
      - 'scripts/parse_minuta_cco.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-minutas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Parse CCO Minutas
        run: python scripts/parse_minuta_cco.py

      - name: Commit & Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mantenimientos.json
          if git diff --staged --quiet; then
            echo "No hay cambios en mantenimientos.json"
          else
            git commit -m "Auto-update mantenimientos.json desde Minuta CCO"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
