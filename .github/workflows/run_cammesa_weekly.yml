name: Test CAMMESA Weekly Fetch

on:
  workflow_dispatch:  # Disparo manual desde GitHub Actions

permissions:
  contents: write  # Permite al workflow commitear cambios en el repo

jobs:
  run-weekly-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CAMMESA Weekly Fetcher
        run: python scripts/fetch_cammesa_weekly.py

      - name: Commit and Push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cammesa_weekly.json
          if git diff --staged --quiet; then
            echo "No hay cambios en cammesa_weekly.json para commitear."
          else
            git commit -m "Update cammesa_weekly.json via manual action [skip ci]"
            git push
          fi
