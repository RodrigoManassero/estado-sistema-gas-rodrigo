name: Update data and deploy

on:
  schedule:
    - cron: '0 13 * * *'  # 10:00 Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Run data pipeline
        timeout-minutes: 13
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/build_data.py

      - name: Generate Injections Forecast
        run: python scripts/generate_injections_forecast.py

      - name: Unify Injections Daily
        run: python scripts/fetch_injections.py

      - name: Type check
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Install course dependencies
        working-directory: ./curso
        run: npm ci

      - name: Build course site
        working-directory: ./curso
        run: npm run build

      - name: Place course under dist/curso
        run: |
          mkdir -p dist/curso
          cp -r curso/dist/. dist/curso/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add public/data/

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data $(date -u +%Y-%m-%d)"
            git pull --rebase -X ours origin main || (git rebase --abort && git pull --no-rebase origin main -s recursive -X ours)
            git push origin main
          else
            echo "No data changes to commit"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: update-and-deploy

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
