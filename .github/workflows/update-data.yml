name: Update data and deploy[cite: 8]

on:[cite: 8]
  schedule:[cite: 8]
    - cron: '0 13 * * *'  # 10:00 Argentina (UTC-3) — tras las 09:45 ya llegó el correo ETGS[cite: 8]
  workflow_dispatch:  # Manual trigger[cite: 8]

permissions:[cite: 8]
  contents: write[cite: 8]
  pages: write[cite: 8]
  id-token: write[cite: 8]

jobs:[cite: 8]
  update-and-deploy:[cite: 8]
    runs-on: ubuntu-latest[cite: 8]
    timeout-minutes: 22[cite: 8]
    steps:[cite: 8]
      - uses: actions/checkout@v4[cite: 8]

      - name: Setup Python[cite: 8]
        uses: actions/setup-python@v5[cite: 8]
        with:[cite: 8]
          python-version: '3.12'[cite: 8]

      - name: Install Python dependencies[cite: 8]
        run: pip install -r requirements.txt[cite: 8]

      - name: Setup Node[cite: 8]
        uses: actions/setup-node@v4[cite: 8]
        with:[cite: 8]
          node-version: '20'[cite: 8]

      - name: Install npm dependencies[cite: 8]
        run: npm ci[cite: 8]

      - name: Run data pipeline[cite: 8]
        timeout-minutes: 13[cite: 8]
        env:[cite: 8]
          GMAIL_USER: ${{ secrets.GMAIL_USER }}[cite: 8]
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}[cite: 8]
        run: python scripts/build_data.py[cite: 8]

      - name: Generate Injections Forecast[cite: 8]
        run: python scripts/generate_injections_forecast.py[cite: 8]

      - name: Generate Injections Daily
        run: node scripts/generate_injections_daily.js

      - name: Type check[cite: 8]
        run: npx tsc --noEmit[cite: 8]

      - name: Build dashboard[cite: 8]
        run: npm run build[cite: 8]

      - name: Install course dependencies[cite: 8]
        working-directory: ./curso[cite: 8]
        run: npm ci[cite: 8]

      - name: Build course site[cite: 8]
        working-directory: ./curso[cite: 8]
        run: npm run build[cite: 8]

      - name: Place course under dist/curso[cite: 8]
        run: |[cite: 8]
          mkdir -p dist/curso[cite: 8]
          cp -r curso/dist/. dist/curso/[cite: 8]

      - name: Commit updated data[cite: 8]
        run: |[cite: 8]
          git config user.name "github-actions[bot]"[cite: 8]
          git config user.email "github-actions[bot]@users.noreply.github.com"[cite: 8]
          git fetch origin main[cite: 8]
          git add public/data/[cite: 8]
          if ! git diff --staged --quiet; then[cite: 8]
            git commit -m "Auto-update data $(date -u +%Y-%m-%d)"[cite: 8]
            # Intento de push seguro con rebase autoresuelto[cite: 8]
            git pull --rebase -X ours origin main || (git rebase --abort && git pull --no-rebase origin main -s recursive -X ours)[cite: 8]
            git push origin main[cite: 8]
          else[cite: 8]
            echo "No data changes to commit"[cite: 8]
          fi[cite: 8]

      - name: Deploy to GitHub Pages[cite: 8]
        uses: peaceiris/actions-gh-pages@v4[cite: 8]
        with:[cite: 8]
          github_token: ${{ secrets.GITHUB_TOKEN }}[cite: 8]
          publish_dir: ./dist[cite: 8]
