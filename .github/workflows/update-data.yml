name: Update data and deploy

on:
  schedule:
    # Horas de Argentina (UTC-3, sin horario de verano) -> UTC. Minutos "raros" a propósito:
    # GitHub demora más los cron que caen justo en :00 o :30.
    - cron: '7 13 * * *'   # 10:07 ART
    - cron: '17 16 * * *'  # 13:17 ART
    - cron: '17 19 * * *'  # 16:17 ART
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Run data pipeline
        timeout-minutes: 13
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/build_data.py

      - name: Generate Injections Forecast
        run: python scripts/generate_injections_forecast.py

      - name: Unify Injections Daily
        run: python scripts/fetch_injections.py

      - name: Type check
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Install course dependencies
        working-directory: ./curso
        run: npm ci

      - name: Build course site
        working-directory: ./curso
        run: npm run build

      - name: Place course under dist/curso
        run: |
          mkdir -p dist/curso
          cp -r curso/dist/. dist/curso/

      # Lógica en scripts/commit_data.sh: si otro workflow pushó mientras tanto, se reaplican los
      # archivos generados por esta corrida (enteros) sobre lo último de main y se reintenta el push.
      - name: Commit updated data
        run: bash scripts/commit_data.sh "Auto-update data $(date -u +%Y-%m-%d)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: update-and-deploy

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
