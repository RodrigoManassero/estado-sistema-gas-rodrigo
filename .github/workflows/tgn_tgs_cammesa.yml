name: TGN_TGS_Cammesa

on:
  schedule:
    # 09:30 ART equivale a 12:30 UTC
    - cron: '30 12 * * *'  # 09:30 ART
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pdfplumber pandas python-docx

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      # --- PASO 1: Procesar TGS (PDFs) ---
      - name: Ejecutar Parser de PDFs TGS
        run: python scripts/parse_etgs.py

      # --- PASO 2: Procesar TGN (Scraping/Playwright) ---
      - name: Fetch TGN
        timeout-minutes: 10
        env:
          TGN_USER: ${{ secrets.TGN_USER }}
          TGN_PASSWORD: ${{ secrets.TGN_PASSWORD }}
        run: python scripts/fetch_tgn.py

      # --- PASO 3: Procesar CAMMESA Weekly Fetcher ---
      - name: Run CAMMESA Weekly Fetcher
        run: python scripts/fetch_cammesa_weekly.py

      # --- PASO 4: Parsear Minutas del CCO (Mantenimientos) ---
      - name: Parse CCO Minutas
        run: python scripts/parse_minuta_cco.py

      # --- PASO 5: Reconstruir JSON diario unificado ---
      - name: Rebuild daily.json
        run: python scripts/build_daily.py

      # --- PASO 6: Chequeo de tipos y Build del Frontend ---
      - name: Type check
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Install course dependencies
        working-directory: ./curso
        run: npm ci

      - name: Build course site
        working-directory: ./curso
        run: npm run build

      - name: Place course under dist/curso
        run: |
          mkdir -p dist/curso
          cp -r curso/dist/. dist/curso/

      # --- PASO 7: Commit y Deploy unificado (incluyendo Cammesa y datos generales) ---
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "TGN, TGS, Cammesa & CCO Mantenimientos auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || git rebase --abort
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
