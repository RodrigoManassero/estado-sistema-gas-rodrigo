name: TGN_TGS_Cammesa

on:
  schedule:
    # Horas de Argentina (UTC-3, sin horario de verano) -> UTC. Minutos "raros" a propósito:
    # GitHub demora más los cron que caen justo en :00 o :30.
    - cron: '37 12 * * *'  # 09:37 ART
    - cron: '37 15 * * *'  # 12:37 ART
    - cron: '37 18 * * *'  # 15:37 ART
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pdfplumber pandas

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      # --- PASO 1: Procesar TGS (PDFs) ---
      - name: Ejecutar Parser de PDFs TGS
        run: python scripts/parse_etgs.py

      # --- PASO 2: Procesar TGN (Scraping/Playwright) ---
      - name: Fetch TGN
        timeout-minutes: 10
        env:
          TGN_USER: ${{ secrets.TGN_USER }}
          TGN_PASSWORD: ${{ secrets.TGN_PASSWORD }}
        run: python scripts/fetch_tgn.py

      # --- PASO 3: Procesar CAMMESA Weekly Fetcher ---
      - name: Run CAMMESA Weekly Fetcher
        run: python scripts/fetch_cammesa_weekly.py

      # --- PASO 4: Reconstruir JSON diario unificado ---
      - name: Rebuild daily.json
        run: python scripts/build_daily.py

      # --- PASO 5: Chequeo de tipos y Build del Frontend ---
      - name: Type check
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Install course dependencies
        working-directory: ./curso
        run: npm ci

      - name: Build course site
        working-directory: ./curso
        run: npm run build

      - name: Place course under dist/curso
        run: |
          mkdir -p dist/curso
          cp -r curso/dist/. dist/curso/

      # --- PASO 6: Commit de datos ---
      # Lógica en scripts/commit_data.sh (reaplica los archivos generados sobre lo último de main y reintenta el push).
      - name: Commit data
        run: bash scripts/commit_data.sh "TGN, TGS & Cammesa auto-update $(date -u +%Y-%m-%dT%H:%MZ)"

      # --- PASO 7: Subir artefacto para GitHub Pages ---
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: fetch-and-build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
