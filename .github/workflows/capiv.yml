name: Actualizar Producción Neuquina (Cap IV)

on:
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub
    inputs:
      years:
        description: 'Años hacia atrás a procesar (ej: 2)'
        required: true
        default: '2'
        type: string

jobs:
  run-capiv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cap IV fetch script
        run: python scripts/fetch_capiv.py --years ${{ github.event.inputs.years }}

      - name: Commit and push updated production data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/produccion_neuquina.json public/data/produccion_neuquina.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualiza produccion neuquina cap iv [skip ci]" && git push)
